<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浅草タイムトラベル</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="cesiumContainer"></div>

  <header class="topbar">
    <div class="brand">浅草タイムトラベル</div>
    <p class="tagline">浅草の街並 × 歴史スポット</p>
  </header>

  <div id="status" class="status">読み込み中…</div>

  <div id="infoBackdrop" class="info-backdrop hidden" hidden></div>
  <aside id="infoPanel" class="info-panel hidden" aria-live="polite">
    <button type="button" id="infoClose" class="info-close" aria-label="閉じる">×</button>
    <h1 id="infoTitle"></h1>
    <p id="infoYears" class="info-years"></p>
    <div id="infoGallery" class="info-gallery hidden">
      <div id="infoGalleryStage" class="info-gallery-stage">
        <button
          type="button"
          id="infoImageButton"
          class="info-image-frame"
          aria-label="写真を全画面表示"
        >
          <img id="infoImage" alt="" class="info-image" />
        </button>
        <div id="infoPhotoMetaOverlay" class="photo-meta-overlay hidden" hidden>
          <h3 class="photo-meta-overlay-title"></h3>
          <p class="photo-meta-overlay-date"></p>
          <p class="photo-meta-overlay-description"></p>
        </div>
        <div class="info-gallery-toolbar">
          <button
            type="button"
            id="infoPhotoMetaToggle"
            class="info-photo-tool-btn hidden"
            aria-label="画像の情報を表示します"
            title="画像の情報を表示します"
            aria-expanded="false"
            aria-controls="infoPhotoMetaOverlay"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
              <path fill="currentColor" d="M11 10h2v7h-2zm0-4h2v2h-2z" />
            </svg>
          </button>
          <button
            type="button"
            id="infoPhotoListToggle"
            class="info-photo-tool-btn hidden"
            aria-label="画像の一覧を表示します"
            title="画像の一覧を表示します"
            aria-expanded="false"
            aria-controls="photoThumbLightbox"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="info-gallery-controls">
        <button type="button" id="infoGalleryPrev" class="info-gallery-nav hidden" aria-label="前の写真">‹</button>
        <span id="infoGalleryCounter" class="info-gallery-counter hidden"></span>
        <button type="button" id="infoGalleryNext" class="info-gallery-nav hidden" aria-label="次の写真">›</button>
      </div>
    </div>
    <p id="infoDescription"></p>
    <p id="infoNote" class="info-note"></p>
    <ul id="infoSources"></ul>
  </aside>

  <div id="photoThumbLightbox" class="photo-thumb-lightbox hidden" role="dialog" aria-modal="true" aria-labelledby="photoThumbTitle" hidden>
    <div class="photo-thumb-lightbox-backdrop" data-thumb-close></div>
    <div class="photo-thumb-lightbox-dialog">
      <button type="button" id="photoThumbClose" class="photo-thumb-lightbox-close" aria-label="閉じる">×</button>
      <h2 id="photoThumbTitle" class="photo-thumb-lightbox-title">写真一覧</h2>
      <p id="photoThumbSubtitle" class="photo-thumb-lightbox-subtitle"></p>
      <div id="infoPhotoList" class="photo-thumb-grid" role="listbox" aria-label="写真一覧"></div>
    </div>
  </div>

  <div id="photoLightbox" class="photo-lightbox hidden" role="dialog" aria-modal="true" aria-label="写真の全画面表示" hidden>
    <div class="photo-lightbox-backdrop" data-lightbox-close></div>
    <div class="photo-lightbox-dialog">
      <button type="button" id="lightboxClose" class="photo-lightbox-close" aria-label="閉じる">×</button>
      <button type="button" id="lightboxPrev" class="photo-lightbox-nav photo-lightbox-prev hidden" aria-label="前の写真">‹</button>
      <button type="button" id="lightboxNext" class="photo-lightbox-nav photo-lightbox-next hidden" aria-label="次の写真">›</button>
      <div class="photo-lightbox-image-wrap" id="lightboxImageViewport">
        <img id="lightboxImage" alt="" class="photo-lightbox-image" draggable="false" />
        <div id="lightboxPhotoMetaOverlay" class="photo-meta-overlay hidden" hidden>
          <h3 class="photo-meta-overlay-title"></h3>
          <p class="photo-meta-overlay-date"></p>
          <p class="photo-meta-overlay-description"></p>
        </div>
        <div class="info-gallery-toolbar photo-lightbox-toolbar">
          <button
            type="button"
            id="lightboxPhotoMetaToggle"
            class="info-photo-tool-btn hidden"
            aria-label="画像の情報を表示します"
            title="画像の情報を表示します"
            aria-expanded="false"
            aria-controls="lightboxPhotoMetaOverlay"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
              <path fill="currentColor" d="M11 10h2v7h-2zm0-4h2v2h-2z" />
            </svg>
          </button>
          <button
            type="button"
            id="lightboxPhotoListToggle"
            class="info-photo-tool-btn hidden"
            aria-label="画像の一覧を表示します"
            title="画像の一覧を表示します"
            aria-expanded="false"
            aria-controls="photoThumbLightbox"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"
              />
            </svg>
          </button>
        </div>
      </div>
      <p class="photo-lightbox-hint">スクロールで拡大 · Esc で閉じる</p>
    </div>
  </div>

  <footer class="credits">
    3D建物・地形は
    <a href="https://www.mlit.go.jp/plateau/" target="_blank" rel="noopener">Project PLATEAU</a>
    、航空写真は地理院タイルを利用
  </footer>

  <aside id="devPanel" class="dev-panel hidden" hidden>
    <div class="dev-panel-label">DEV アングル</div>
    <p id="devSpotName" class="dev-panel-spot">スポット未選択</p>
    <dl class="dev-panel-values">
      <div>
        <dt>viewHeading</dt>
        <dd id="devHeading">—</dd>
      </div>
      <div>
        <dt>viewPitch</dt>
        <dd id="devPitch">—</dd>
      </div>
      <div>
        <dt>viewRange</dt>
        <dd id="devRange">—</dd>
      </div>
    </dl>
    <button type="button" id="devCopyAngle" class="dev-panel-copy">
      シート用にコピー
    </button>
    <button type="button" id="devPreviewAngle" class="dev-panel-copy dev-panel-copy-secondary">
      往復チェック（今の位置で寄り直し）
    </button>
    <p id="devCopyStatus" class="dev-panel-status"></p>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
